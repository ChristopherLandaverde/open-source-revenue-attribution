[project]
name = "osra-mcp"
version = "0.1.0"
description = "Local stdio MCP server for a self-hosted Open Source Revenue Attribution instance (read-only)."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # Exact pin, released 2026-10-02. Upgrade on purpose, not by resolution.
    "mcp==2.3.0",
    # mcp's own HTTP client; imported directly, so declared.
    "httpx2>=2.10",
]

[project.scripts]
osra-mcp = "osra_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osra_mcp"]
