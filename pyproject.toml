[project]
name = "open-source-revenue-attribution"
version = "0.1.0"
description = "Self-hostable, auditable B2B revenue attribution."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.12",
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
    { include-group = "mcp" },
]
# The local MCP server (mcp-server/, entry point `osra-mcp`). Not needed by the Django app:
# the production image installs without dev groups. `uv sync` installs it for development.
mcp = ["osra-mcp"]

[tool.uv]
package = false

[tool.uv.sources]
osra-mcp = { path = "mcp-server", editable = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]

[tool.ruff.format]
exclude = ["*/migrations/*"]
